<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/143026952?v=4&size=64">
    <title>Profile Card</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      
      * {
        font-family: "Barlow Condensed", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: black;
        height: 100vh;
      }
      div {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgb(255, 255, 255);
        padding: 20px;
        border-radius: 10px;
        margin-top: 40px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        transition: 0.3s ease;
      }
      img {
        border-radius: 50%;
        margin-bottom: 10px;
        width: 100px;
        height: 100px;
      }
      a {
        text-decoration: none;
        color: black;
      }
      p {
        text-decoration: underline;
        color: black;
      }
      .title {
        font-size: 24px;
        font-weight: bold;
      }
      .social {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-content: space-between;
        gap: 20px;
      }
      .social-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .social-item h3 {
        margin-bottom: 5px;
      }
      div .social:hover {
        transform: scale(1.05);
      }
      .social-item a:hover {
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="https://avatars.githubusercontent.com/u/143026952?v=4&size=64"
        alt="profile"
      />
      <h1>Hariom Virkhare</h1>
      <h3>Full Stack dev boy</h3>

      <p class="title">Social Links</p>
      <div class="social">
        <div class="social-item">
          <h3>Github</h3>
          <a href="https://github.com/Hariomop12">
            <i data-lucide="user"></i
          ></a>
        </div>

        <div class="social-item">
          <h3>Instagram</h3>
          <a href="https://instagram.com/hariomop12">
            <i data-lucide="bone"></i
          ></a>
        </div>
        <div class="social-item">
          <h3>Leetcode</h3>
          <a href="https://leetcode.com/hariomop12">
            <i data-lucide="code"></i
          ></a>
        </div>
      </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
