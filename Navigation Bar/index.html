<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

      * {
        font-family: "Barlow Condensed", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0f172a;  
        height: 100vh;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        background-color: #020617;  
        color: #e2e8f0;
        padding: 12px 20px;
        position: fixed;
        width: 100%;
        top: 0;
        border-bottom: 1px solid #1e293b;
      }

      .nav-links {
        display: flex;
        gap: 25px;
        align-items: center;
        list-style: none;
      }

      .nav-links a {
        text-decoration: none;
        color: #cbd5f5;
        font-weight: 500;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: #f97316; /* orange accent */
      }

      .logo p {
        font-size: 22px;
        font-weight: 600;
      }

      .spa {
        color: #f97316;
      }

      /* Buttons */
      .login {
        background-color: transparent;
        color: #f97316;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #f97316;
        cursor: pointer;
        margin-right: 10px;
        transition: 0.3s;
      }

      .login:hover {
        background-color: #f97316;
        color: black;
      }

      .signup {
        background-color: #f97316;
        color: black;
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: 0.3s;
      }

      .signup:hover {
        background-color: #ea580c;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <p class="p">hari<span class="spa">OM</span></p>
      </div>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
      </ul>
      <div>
        <button class="login">Login</button>
        <button class="signup">Signup</button>
      </div>
    </nav>
  </body>
</html>
