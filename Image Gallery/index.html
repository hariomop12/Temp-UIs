<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Barlow Condensed", sans-serif;
      }

      body {
        background: #0f172a;
        display: flex;
        justify-content: center;
        padding: 20px;
        color: #e2e8f0;
      }

      .heading {
        color: #fff;
        font-size: 50px;
        justify-self: center;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(250px, 1fr));
        gap: 20px;
        padding-top: 20px;
      }
      .gallery-items {
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .gallery-items img {
        width: 100%;
        border-radius: 12px;
      }

      .gallery-caption {
        opacity: 0;
        transform: translateY(10px);
        transition: 0.3s ease;
      }

      .gallery-items:hover .gallery-caption {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        .gallery {
          grid-template-columns: repeat(2, minmax(250px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="warper">
      <h1 class="heading">Image Gallery</h1>
      <div class="gallery">
        <div class="gallery-items">
          <img
            class="gallery-img"
            src="https://picsum.photos/400/300"
            alt="temp"
          />
          <p class="gallery-caption">Images 1</p>
        </div>
        <div class="gallery-items">
          <img
            class="gallery-img"
            data-src="https://picsum.photos/400/300"
            src="https://picsum.photos/400/300"
            alt="temp"
          />
          <p class="gallery-caption">Images 2</p>
        </div>
        <div class="gallery-items">
          <img
            class="gallery-img"
            data-src="https://picsum.photos/400/300"
            src="https://picsum.photos/400/300"
            alt="temp"
          />
          <p class="gallery-caption">Images 3</p>
        </div>
      </div>
    </div>
    <script>
      // Get the gallery element
      const gallery = document.querySelector(".gallery");

      // Intersection Observer for lazy loading images
      const imgObserver = new IntersectionObserver(
        (entries, obs) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const img = entry.target;
              if (img.getAttribute('data-src')) {
                img.src = img.getAttribute('data-src');
              }
              obs.unobserve(img);
            }
          });
        },
        { threshold: 0.2 }
      );

      // Function to create new images
      function loadImages(count = 100) {
        if (!gallery) return;

        for (let i = 0; i < count; i++) {
          const item = document.createElement("div");
          item.className = "gallery-items";

          item.innerHTML = `
            <img class="gallery-img"
                 data-src="https://picsum.photos/400/300?random=${Math.random()}"
                 src="https://via.placeholder.com/10" />
            <p class="gallery-caption">New Image</p>
          `;

          gallery.appendChild(item);

          const img = item.querySelector("img");
          if (img) {
            imgObserver.observe(img);
          }
        }
      }

      // Infinite scroll trigger
      const scrollObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          loadImages(100);
        }
      });

      // Trigger element (bottom sentinel)
      const sentinel = document.createElement("div");
      sentinel.style.height = "20px";
      document.body.appendChild(sentinel);

      scrollObserver.observe(sentinel);

      // Initial load
      loadImages(100);
    </script>
  </body>
</html>
